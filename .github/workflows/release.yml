# Release pipeline for GitHub. The only trigger that publishes is a pushed
# tag vX.Y.Z, which must be an annotated tag SSH-signed by a key in
# allowed_signers and must match CHANGELOG.md (release-me tag verify).
# Assets are built by two independent builders (x86_64 and arm64) whose
# outputs must be identical, each also rebuilt in place; the manifest is
# attested keylessly through Sigstore with the workflow's identity; the
# release is created as a draft, every asset re-downloaded and checked, then
# published; and a separate job verifies the published release exactly as a
# recipient would, including rebuilding it from the tag.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"

jobs:
  build:
    name: Verify tag and build
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix (pinned, first-party)
        run: scripts/install-nix.sh
      - name: Build release-me
        run: nix build .#release-me --print-build-logs --out-link tool
      - name: Verify the release tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tool/bin/release-me tag verify --tag "$TAG" --allowed-signers allowed_signers --branch origin/main --json | tee tag.json
      - name: Check
        run: nix flake check --print-build-logs
      - name: Build release assets
        run: nix build .#release-assets --print-build-logs --out-link assets
      - name: Rebuild and require identical output
        run: nix build .#release-assets --rebuild
      - name: Require the built version to equal the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          built="$(nix eval --raw .#lib.versionInfo.version)"
          [ "v$built" = "$TAG" ] || { echo "::error::built version $built != tag $TAG"; exit 1; }
          [ "$(nix eval --json .#lib.versionInfo.isRelease)" = "true" ] || { echo "::error::checkout is not a release state"; exit 1; }
          ls -l assets/
      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.runner }}
          path: assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # Sigstore keyless signing of the provenance
      attestations: write # store the attestation with the repository
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix (pinned, first-party)
        run: scripts/install-nix.sh
      - name: Build release-me
        run: nix build .#release-me --print-build-logs --out-link tool
      - name: Verify the release tag again and extract the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tool/bin/release-me tag verify --tag "$TAG" --allowed-signers allowed_signers --branch origin/main --notes-out notes.md --json | tee tag.json
      - name: Download assets from both builders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
      - name: Require identical assets from the x86_64 and arm64 builders
        run: |
          tool/bin/release-me manifest diff assets-ubuntu-26.04/SHA256SUMS assets-ubuntu-26.04-arm/SHA256SUMS
          tool/bin/release-me manifest check assets-ubuntu-26.04-arm
          mv assets-ubuntu-26.04 assets
          tool/bin/release-me manifest check assets
      - name: Write and sign the provenance statement (Sigstore, keyless)
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(jq -r .commit tag.json)"
          version="${TAG#v}"
          tool/bin/release-me provenance \
            --manifest assets/SHA256SUMS \
            --source-uri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --commit "$commit" --tag "$TAG" \
            --build-command "nix build .#release-assets" \
            --toolchain "go=https://go.dev/dl/go$(nix eval --raw .#goToolchain.version).linux-amd64.tar.gz" \
            --toolchain "nixpkgs=github:NixOS/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev flake.lock)" \
            --out "assets/release-me_${version}_provenance.intoto.json"
          tool/bin/release-me sign sigstore \
            --statement "assets/release-me_${version}_provenance.intoto.json" \
            --out "assets/release-me_${version}_provenance.sigstore.json" \
            --github-actions --store-github "$GITHUB_REPOSITORY"
          ls -l assets/
      - name: Create draft release, upload and check assets, publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tool/bin/release-me publish --host github --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" --commit "$(jq -r .commit tag.json)" --dir assets --notes-file notes.md --json | tee publish.json
      - name: Summary
        run: |
          {
            echo "## Release published"
            echo "- Release: $(jq -r .release_url publish.json)"
            echo '```'
            cat assets/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify as a recipient
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix (pinned, first-party)
        run: scripts/install-nix.sh
      - name: Build release-me
        run: nix build .#release-me --print-build-logs --out-link tool
      - name: Download, check, verify the attestation, rebuild from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          tool/bin/release-me verify --policy release-policy.github.json --tag "$TAG" --reproduce --json
