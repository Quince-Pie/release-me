# actionlint's built-in list of GitHub-hosted runner labels lags behind
# GitHub: ubuntu-26.04 and ubuntu-26.04-arm became generally available on
# 2026-09-17. Declaring them here keeps the [runner-label] check strict for
# everything else.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
